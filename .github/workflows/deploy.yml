name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Stats data-safety tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run data-loss guards
        run: python3 -m unittest discover -s tests -v

  deploy:
    name: Deploy to Oracle
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            /usr/local/bin/bigtoss-deploy
            # Keep the on-box deploy script in sync with the repo (never touch logs)
            if [ -f /opt/bigtoss/deploy/bigtoss-deploy.sh ]; then
              sudo install -m 755 /opt/bigtoss/deploy/bigtoss-deploy.sh /usr/local/bin/bigtoss-deploy
            fi
